spring.application.name=hiddengems-backend
# ---- Database (PostgreSQL) ----
# Change the password to match your PostgreSQL setup (or set the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:postgresql://localhost:5432/hgdb-dev
spring.datasource.username=hguser
spring.datasource.password=hguser
# The schema is manually created using schema.sql; Spring only verifies entity compatibility
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# ---- JWT ----
# Development secret (Base64, 48 bytes). In production, set it via the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:UEDW7C1ISGtbsA1pcXvuYnww+FQOwTkKvcJDHx57AMaMeUz7vRl+wj8a2uZMGyJr}
# 24 hours
app.jwt.expiration-ms=86400000
# ---- Admin account automatically created at startup (if it does not exist) ----
app.admin.username=admin
app.admin.email=admin@hiddengems.local
app.admin.password=admina123