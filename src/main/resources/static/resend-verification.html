<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/hidden-gems-icon.svg">
    <title>Resend verification · Hidden Gems</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<section class="auth-screen">
    <a class="landing-return" href="/login">← Back to login</a>
    <div class="auth-story">
        <span class="story-star">✦</span><p class="story-kicker">CHECK YOUR INBOX</p>
        <h1>We’ll send<br>another link.</h1>
        <p>Enter the email address you used when creating your account.</p>
    </div>
    <div class="auth-card">
        <div class="wordmark">Hidden Gems<span>VERIFY EMAIL</span></div>
        <form id="action-form" class="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255"></label>
            <button type="submit" class="btn-primary">Resend verification</button>
            <p id="message" class="form-message" role="status"></p>
        </form>
    </div>
</section>
<script src="api.js"></script>
<script src="account-email.js" data-endpoint="/api/auth/resend-verification"></script>
</body>
</html>
