<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/hidden-gems-icon.svg">
    <title>Forgot password · Hidden Gems</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<section class="auth-screen">
    <a class="landing-return" href="/login">← Back to login</a>
    <div class="auth-story">
        <span class="story-star">✦</span><p class="story-kicker">ACCOUNT ACCESS</p>
        <h1>A fresh start<br>is one email away.</h1>
        <p>Enter the email address connected to your account and we’ll send a password reset link.</p>
    </div>
    <div class="auth-card">
        <div class="wordmark">Hidden Gems<span>RESET PASSWORD</span></div>
        <form id="action-form" class="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required maxlength="255"></label>
            <button type="submit" class="btn-primary">Send reset link</button>
            <p id="message" class="form-message" role="status"></p>
        </form>
    </div>
</section>
<script src="api.js"></script>
<script src="account-email.js" data-endpoint="/api/auth/password/forgot"></script>
</body>
</html>
