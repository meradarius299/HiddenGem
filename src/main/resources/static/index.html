<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hidden Gems</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Hidden Gems</h1>
    <div id="keys" aria-live="polite"></div>
</header>

<main>
    <section class="map-panel" aria-label="Explore hidden gems">
        <div id="map" aria-label="Interactive map of hidden gems"></div>
        <p id="map-status" class="map-status" role="status" hidden></p>
        <nav id="map-views" class="map-views" aria-label="Map views" hidden>
            <button type="button" id="view-globe">Globe</button>
            <button type="button" id="view-gems">Explore gems</button>
        </nav>
        <div id="map-detail" class="map-detail" role="region" aria-label="Gem details" hidden></div>
        <div class="map-legend" aria-label="Map legend">
            <span><i class="legend-dot"></i> To discover</span>
            <span><i class="legend-dot collected"></i> Collected</span>
        </div>
    </section>
    <aside>
        <button type="button" id="add-gem">+ Add a gem</button>
        <ul id="list"></ul>
        <div class="dev">
            <label><input type="checkbox" id="fake"> Fake my location (click the map)</label>
            <button type="button" id="reset">Reset progress</button>
            <p id="status"></p>
        </div>
    </aside>
</main>

<div id="nearby" role="alert" hidden>
    <p id="nearby-text"></p>
    <button type="button" id="nearby-open">Unlock story</button>
    <button type="button" id="nearby-close" class="plain">Not now</button>
</div>

<dialog id="story"></dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="api.js"></script>
<script src="map-layer.js"></script>
<script src="globe.js"></script>
<script src="boot.js"></script>
<script src="social.js"></script>
<script src="rewards.js"></script>
</body>
</html>
