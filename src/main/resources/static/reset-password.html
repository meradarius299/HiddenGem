<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/hidden-gems-icon.svg">
    <title>Choose a new password · Hidden Gems</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<section class="auth-screen">
    <a class="landing-return" href="/login">← Back to login</a>
    <div class="auth-story">
        <span class="story-star">✦</span><p class="story-kicker">ACCOUNT ACCESS</p>
        <h1>Choose a<br>new password.</h1>
        <p>Use a password you have not used for another account.</p>
    </div>
    <div class="auth-card">
        <div class="wordmark">Hidden Gems<span>NEW PASSWORD</span></div>
        <form id="reset-form" class="auth-form">
            <label>New password<span class="password-wrap"><input name="password" type="password" autocomplete="new-password" minlength="6" maxlength="100" required><button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="eye-shape" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle class="eye-pupil" cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></span></label>
            <label>Confirm password<span class="password-wrap"><input name="confirm" type="password" autocomplete="new-password" minlength="6" maxlength="100" required><button type="button" class="password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="eye-shape" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle class="eye-pupil" cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3 21 21"/></svg></button></span></label>
            <button type="submit" class="btn-primary">Update password</button>
            <p id="message" class="form-message" role="status"></p>
            <p class="auth-aux"><a id="login-link" href="/login" hidden>Go to login</a></p>
        </form>
    </div>
</section>
<script src="api.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
