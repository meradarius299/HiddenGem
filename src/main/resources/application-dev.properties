spring.application.name=my-town-hidden-gems
# Show SQL queries in logs
spring.jpa.show-sql=true
# Database connection properties
spring.datasource.url=jdbc:postgresql://localhost:5432/hgdb-dev
spring.datasource.username=hguser
spring.datasource.password=hguser
# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
# Google OAuth client ID
google.client.id=820459243630-b8d6pc0gkdrvl9rgfma149q7n56evs55.apps.googleusercontent.com
# Disable Open Entity Manager in view
spring.jpa.open-in-view=false
##Hibernate properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
# Server port
server.port=8080
# Dummy property for development testing
pms.dummy=This is a dummy for the dev environment